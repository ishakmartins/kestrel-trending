name: Kestrel-Trending

on:
  schedule:
    - cron: "*/30 * * * *" # scrape + rebuild dashboard + rebuild Pages site, every 30 min
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kestrel-trending-run
  cancel-in-progress: false

jobs:
  run:
    # Single job, not split scrape/report jobs on the same cadence: two jobs both
    # triggered every 30 min would race to `git push` against the same branch. One
    # job, sequential steps, one commit at the end avoids that.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Scrape trends24.in/indonesia/
        run: python -m trending.scraper

      - name: Rebuild interactive dashboard
        run: python -m trending.report

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build Astro site
        run: npm run build
        working-directory: site

      - name: Verify dashboard + site output
        run: |
          if [ ! -s dataset/trends/latest_interactive.html ]; then
            echo "dataset/trends/latest_interactive.html missing or empty — refusing to push"
            exit 1
          fi
          if [ ! -s docs/index.html ]; then
            echo "docs/index.html missing or empty — refusing to push broken site"
            exit 1
          fi
          if [ ! -s docs/trending/index.html ]; then
            echo "docs/trending/index.html missing or empty — refusing to push broken page"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/trends/trends24_id.csv dataset/trends/latest_interactive.html docs/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: refresh trending data + dashboard [skip ci]"
            git push
          fi
      # Repo Settings -> Pages -> "Deploy from a branch": main / docs. This is the existing
      # setup (unchanged by this workflow) — Astro's outDir is docs/ (site/astro.config.mjs),
      # so this stays a plain static-file Pages deploy, no Actions-based Pages flow needed.
